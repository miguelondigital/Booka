# Render Blueprint: one Node web service + one managed PostgreSQL database.
# See README.md → "Hosting on Render". Not yet tested against a live deploy.
databases:
  - name: booka-db
    databaseName: booka
    plan: free

services:
  - type: web
    name: booka
    runtime: node
    # Pre-deploy commands require a paid instance type. On the free type, remove
    # preDeployCommand and use this build command instead:
    #   npm ci --include=dev && npm run build && npx prisma migrate deploy
    plan: starter
    # --include=dev: the build needs Vite/TypeScript/esbuild even though
    # NODE_ENV=production is set for the runtime.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: booka-db
          property: connectionString
